name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'designs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: 构建 / 测试 / 打包
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0.x', '10.0.x']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ matrix.dotnet }}
            10.0.x

      - name: 还原
        run: dotnet restore LiteDriver.slnx

      - name: 构建（Release，警告视为错误）
        run: dotnet build LiteDriver.slnx -c Release --no-restore -warnaserror

      - name: 单元与环回集成测试
        run: dotnet test tests/LiteDriver.Tests/LiteDriver.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: 打包
        run: |
          dotnet pack src/LiteDriver/LiteDriver.csproj -c Release --no-build -o artifacts
          dotnet pack src/LiteDriver.Hosting/LiteDriver.Hosting.csproj -c Release --no-build -o artifacts

      - name: 校验核心包零依赖
        run: |
          set -e
          cd artifacts
          rm -rf verify && mkdir verify && cd verify
          CORE=$(ls ../LiteDriver.[0-9]*.nupkg | head -1)
          unzip -o -q "$CORE"
          if grep -q '<dependency ' LiteDriver.nuspec; then
            echo "::error::LiteDriver 核心包出现 PackageReference 依赖，违反零依赖承诺"
            grep '<dependency ' LiteDriver.nuspec
            exit 1
          fi
          echo "核心包依赖组为空，符合零依赖承诺"
          grep -o 'targetFramework="[^"]*"' LiteDriver.nuspec | sort -u

          rm -rf v2 && mkdir v2 && cd v2
          HOST=$(ls ../../LiteDriver.Hosting.[0-9]*.nupkg | head -1)
          unzip -o -q "$HOST"
          echo "=== LiteDriver.Hosting 依赖检查（只允许 *Abstractions）==="
          DEPS=$(grep -o 'id="[^"]*"' LiteDriver.Hosting.nuspec | sed 's/id="//;s/"//' | grep -v '^LiteDriver$' | sort -u)
          echo "$DEPS"
          BAD=$(echo "$DEPS" | grep -v -E '\.Abstractions$' | grep -v '^$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Hosting 包出现非 Abstractions 依赖：$BAD"
            exit 1
          fi
          echo "Hosting 包只依赖 Abstractions，符合轻量承诺"

      - name: 上传包产物
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-dotnet-${{ matrix.dotnet }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          retention-days: 7

  aot-smoke:
    name: NativeAOT 原生二进制 smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 安装 AOT 前置依赖（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: 发布 net10.0 原生二进制
        run: dotnet publish tests/LiteDriver.AotSmoke/LiteDriver.AotSmoke.csproj -c Release -f net10.0 -r ${{ matrix.rid }} -o publish/aot10 -warnaserror

      - name: 断言确为真 AOT（无 runtimeconfig.json）
        shell: bash
        run: |
          set -e
          if [ -f publish/aot10/LiteDriver.AotSmoke.runtimeconfig.json ]; then
            echo "::error::产物含 runtimeconfig.json，说明退回 JIT，不是真 AOT"
            exit 1
          fi
          echo "确认无 runtimeconfig.json，属真 NativeAOT 产物"
          ls -la publish/aot10

      - name: 运行原生二进制（net10.0）
        shell: bash
        run: |
          set -e
          BIN=publish/aot10/LiteDriver.AotSmoke
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          "$BIN" | tee smoke10.log
          grep -q "ALL CHECKS PASSED" smoke10.log

      - name: 发布并运行 net8.0 原生二进制
        shell: bash
        run: |
          set -e
          dotnet publish tests/LiteDriver.AotSmoke/LiteDriver.AotSmoke.csproj -c Release -f net8.0 -r ${{ matrix.rid }} -o publish/aot8 -warnaserror
          if [ -f publish/aot8/LiteDriver.AotSmoke.runtimeconfig.json ]; then
            echo "::error::net8.0 产物含 runtimeconfig.json，不是真 AOT"
            exit 1
          fi
          BIN=publish/aot8/LiteDriver.AotSmoke
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          "$BIN" | tee smoke8.log
          grep -q "ALL CHECKS PASSED" smoke8.log

      - name: 发布并运行 Hosting 集成的原生二进制（net10.0 / net8.0）
        shell: bash
        run: |
          set -e
          for TFM in net10.0 net8.0; do
            OUT="publish/host-${TFM}"
            dotnet publish tests/LiteDriver.Hosting.AotSmoke/LiteDriver.Hosting.AotSmoke.csproj \
              -c Release -f "$TFM" -r ${{ matrix.rid }} -o "$OUT" -warnaserror
            if [ -f "$OUT/LiteDriver.Hosting.AotSmoke.runtimeconfig.json" ]; then
              echo "::error::$TFM Hosting 产物含 runtimeconfig.json，不是真 AOT"
              exit 1
            fi
            BIN="$OUT/LiteDriver.Hosting.AotSmoke"
            if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
            "$BIN" | tee "host-${TFM}.log"
            grep -q "ALL CHECKS PASSED" "host-${TFM}.log"
          done

  sample-host:
    name: 通用主机示例实跑
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 构建示例
        run: dotnet build samples/LiteDriver.SampleHost/LiteDriver.SampleHost.csproj -c Release

      - name: 运行示例并断言关键输出
        run: |
          set -e
          dotnet samples/LiteDriver.SampleHost/bin/Release/net10.0/LiteDriver.SampleHost.dll | tee sample.log
          grep -q "交换结果 Executed" sample.log
          grep -q "重连成功" sample.log
          grep -q "删除设备：Applied" sample.log
          grep -q "已停机" sample.log
