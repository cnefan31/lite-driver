<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{
    --bg:#0b0d11; --canvas:#0f1218; --panel:#151920; --panel-2:#1c2129;
    --ink:#e7ecf3; --muted:#8a95a6; --line:#232a34; --line-2:#2f3743;
    --accent:#4c8dff; --ok:#3ecf8e; --warn:#e8b64c; --bad:#f2635f;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:13px/1.6 var(--sans);
    overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  /* 顶栏 */
  .topbar{height:50px;flex:0 0 50px;display:flex;align-items:center;gap:12px;padding:0 14px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141821,#0f1218)}
  .brand{font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}
  .stats{display:flex;gap:5px;overflow:hidden}
  .chip{font:11px var(--mono);color:var(--muted);background:var(--panel-2);border:1px solid var(--line);
    border-radius:6px;padding:3px 8px;white-space:nowrap}
  .chip b{color:var(--ink);font-weight:600}
  .spacer{flex:1}
  button{font:600 12px var(--sans);border-radius:7px;border:1px solid var(--line-2);
    background:var(--panel-2);color:var(--ink);padding:6px 13px;cursor:pointer;transition:.13s}
  button:hover{border-color:#46506a;background:#252b36}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#3d7ce8}
  button.ghost{background:transparent}
  button.danger{color:var(--bad);border-color:rgba(242,99,95,.35)}
  button.danger:hover{background:rgba(242,99,95,.1)}
  button:disabled{opacity:.45;cursor:not-allowed}

  /* 三栏 */
  .main{flex:1;display:grid;grid-template-columns:186px 1fr 316px;min-height:0}
  .side{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto}
  .side.right{border-right:0;border-left:1px solid var(--line)}
  .side-title{font:600 10.5px var(--sans);text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);padding:11px 13px 7px}

  /* 托盘 */
  .palette{padding:0 9px 12px;display:flex;flex-direction:column;gap:6px}
  .source{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:grab;
    background:var(--panel-2);border:1px solid var(--line);transition:.13s;user-select:none}
  .source:hover{border-color:var(--line-2);transform:translateX(2px)}
  .source .ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
    font-size:11px;font-weight:700;flex:0 0 24px}
  .source .t{font-weight:600;font-size:12px}
  .source .d{font-size:10.5px;color:var(--muted);line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 画布 */
  .canvas-wrap{position:relative;overflow:hidden;
    background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.045) 1px,transparent 0) 0 0/20px 20px,
    var(--canvas)}
  /* 不能用 none：父级 none 会阻断子 path 的 pointer-events:stroke 命中，
     导致连线点不中、删不掉。改为 auto，仅让带 data-edge 的厚热区可命中。 */
  /* 连线必须画在节点之下：svg 置于 DOM 中 .canvas 之前，且不加 z-index。
     若把 svg 抬到节点之上，线条会横穿卡片，视觉上一团乱。
     命中问题改用「canvas 本身不拦截、热区单独可点」解决，见 .canvas 与 path[data-edge]。 */
  /* 可见连线在节点之下；命中用独立的上层热区层，两者不互相遮挡。 */
  svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  /* 热区在最上层，才能点到被节点覆盖的线段；宽度收窄到 12 以免大面积遮挡节点拖动。 */
  svg.wirehits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
  svg.wirehits path{pointer-events:stroke}
  /* canvas 只承载节点，本身不吃事件；空白拖动由 wrap 兜底。
     这样位于其下的 svg 热区仍能被点到。 */
  .canvas{position:absolute;inset:0;pointer-events:none}
  .canvas .node{pointer-events:auto}

  /* 节点 */
  .node{position:absolute;width:230px;border-radius:10px;background:var(--panel);
    border:1px solid var(--line-2);box-shadow:0 6px 18px rgba(0,0,0,.34);cursor:grab;
    user-select:none;transition:box-shadow .13s,border-color .13s}
  .node:hover{border-color:#48536a}
  .node.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 24px rgba(76,141,255,.2)}
  .node.err{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
  .node.dragging{cursor:grabbing;z-index:5}
  .node-head{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line)}
  .node-head .ic{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;
    font-size:10px;font-weight:700;flex:0 0 19px}
  .node-head .nm{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;flex:1}
  .node-body{padding:7px 10px 9px;font-size:11px;color:var(--muted);line-height:1.5}
  .node-body .kv{display:flex;justify-content:space-between;gap:6px}
  .node-body .kv span:last-child{color:#bdc6d4;font-family:var(--mono);font-size:10.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 端口单列铺满：每行一个端口，连接圆点绝对定位压在节点边框上。
     这是 React Flow / litegraph 等编辑器的通行做法：
     锚点不参与内容流，因此永远不会因宽度或顺序变化跑到中间。 */
  .ports{display:flex;flex-direction:column;gap:1px;padding:2px 0 6px}
  .port-col{display:contents}
  /* 端口行：圆点绝对定位在节点边框上，标签与徽标用 padding 让开。
     圆点不参与内容流，因此翻转、宽度变化都不会把它带偏
     —— 这与 React Flow 的 Handle 实现一致。 */
  .port{position:relative;display:flex;align-items:center;gap:6px;
    font:10px var(--mono);color:#8b96a8;cursor:crosshair;
    padding:2px 0;min-height:20px;transition:.12s;
    -webkit-user-select:none;user-select:none}

  .port .pdot{position:absolute;top:50%;transform:translateY(-50%);
    width:11px;height:11px;border-radius:50%;background:var(--panel-2);
    border:2px solid var(--line-2);transition:.12s;z-index:1}

  /* 输入：圆点在左边框，内容从圆点右侧开始 */
  .port.in{justify-content:flex-start;padding-left:14px;padding-right:10px}
  .port.in .pdot{left:-6px}

  /* 输出：圆点在右边框，内容向圆点靠右 */
  .port.out{justify-content:flex-end;padding-left:10px;padding-right:14px}
  .port.out .pdot{right:-6px}

  .port.compat .pdot{background:var(--ok);border-color:var(--ok);box-shadow:0 0 6px var(--ok)}
  .port.linked .pdot{background:var(--accent);border-color:var(--accent)}
  .port.incompat{opacity:.32;cursor:not-allowed}

  /* 翻转：输入与输出互换所在边框，内容对齐同步翻转 */
  .node.flipped .port.in{justify-content:flex-end;padding-left:10px;padding-right:14px}
  .node.flipped .port.in .pdot{left:auto;right:-6px}
  .node.flipped .port.out{justify-content:flex-start;padding-left:14px;padding-right:10px}
  .node.flipped .port.out .pdot{right:auto;left:-6px}

  .port .plabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
  .port .pdir{font-size:8px;color:#5c6878;flex:0 0 auto}
  .port:hover{background:rgba(76,141,255,.14);color:var(--accent)}
  /* 注意：翻转靠交换 DOM 列顺序实现（见 renderNodes），
     此处不能再加 row-reverse，否则两者抵消，位置纹丝不动。 */
  .ptype{font:9px var(--mono);color:#66707f;background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:3px;padding:0 3px;flex:0 0 auto}
  .port:hover .ptype{color:#9db4d0;border-color:var(--line-2)}
  .node.flipped .node-head{flex-direction:row-reverse}

  .port.in{cursor:default}
  .port.in:hover{background:rgba(255,255,255,.05);color:#8b96a8}
  .port.linked .pdot{background:var(--accent);border-color:var(--accent)}
  .port.compat .pdot{background:var(--ok);border-color:var(--ok);box-shadow:0 0 6px var(--ok)}
  .port.incompat{opacity:.32;cursor:not-allowed}

  /* 属性面板 */
  .props{padding:0 13px 16px}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
  .field input,.field select,.field textarea{width:100%;padding:6px 8px;border-radius:6px;
    border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font:11.5px var(--mono)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  .field .hint{font-size:10px;color:#5f6878;margin-top:3px;line-height:1.35}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .empty{padding:26px 13px;text-align:center;color:#5a6376;font-size:11.5px;line-height:1.7}
  .tx-box{margin:12px 0;padding:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px}
  .tx-box .tx-title{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .tx-box textarea{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line-2);
    background:var(--bg);color:var(--ink);font:11.5px var(--mono);resize:vertical}
  .ports-view{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;
    padding:8px 9px;background:var(--panel-2);border-radius:7px;border:1px solid var(--line)}
  .ports-view .pv{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--muted)}
  .ports-view .pv b{color:#aab4c4;font-weight:600}

  /* 底部 */
  .statusbar{height:28px;flex:0 0 28px;display:flex;align-items:center;gap:12px;padding:0 13px;
    border-top:1px solid var(--line);background:var(--panel);font:10.5px var(--mono);color:var(--muted)}
  .statusbar .msg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .statusbar .msg.ok{color:var(--ok)} .statusbar .msg.bad{color:var(--bad)}

  /* 事件抽屉 */
  .drawer{position:absolute;right:0;bottom:0;width:316px;max-height:42%;background:var(--panel);
    border-left:1px solid var(--line);border-top:1px solid var(--line);display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .18s;z-index:20}
  .drawer.open{transform:none}
  .drawer h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    padding:8px 11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .drawer .list{overflow-y:auto;font:10px/1.6 var(--mono);padding:6px 11px 11px}
  .drawer .list div{color:#939dae;word-break:break-all}
  .drawer .list .k{color:var(--accent)} .drawer .list .bad{color:var(--bad)}

  .linkhint{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:30;
    background:rgba(76,141,255,.16);border:1px solid var(--accent);color:#cfe2ff;
    padding:6px 14px;border-radius:7px;font-size:12px;display:none;pointer-events:none}
  .linkhint.show{display:block}
  .toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);padding:8px 16px;
    border-radius:7px;font-size:12px;font-weight:600;z-index:50;opacity:0;transition:.2s;
    pointer-events:none;max-width:60%}
  .toast.show{opacity:1}
  .toast.ok{background:rgba(62,207,142,.14);color:var(--ok);border:1px solid rgba(62,207,142,.4)}
  .toast.bad{background:rgba(242,99,95,.14);color:var(--bad);border:1px solid rgba(242,99,95,.45)}
  @media(max-width:1080px){.main{grid-template-columns:160px 1fr 286px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot" id="liveDot"></span>{{TITLE}}</div>
  <div class="stats">
    <span class="chip">客户端 <b id="sClient">0</b></span>
    <span class="chip">服务端 <b id="sServer">0</b></span>
    <span class="chip">就绪 <b id="sReady">0</b></span>
    <span class="chip">会话 <b id="sSess">0</b></span>
    <span class="chip">rev <b id="sRev">0</b></span>
  </div>
  <div class="spacer"></div>
  <button class="ghost" id="btnEvents">事件</button>
  <button class="ghost" id="btnValidate">校验</button>
  <button class="primary" id="btnApply">保存并应用</button>
</div>

<div class="main">
  <aside class="side">
    <div class="side-title">节点</div>
    <div class="palette" id="palette"></div>
    <div class="side-title">操作</div>
    <div class="palette">
      <button class="ghost" id="btnClear" style="width:100%">清空画布</button>
    </div>
  </aside>

  <div class="canvas-wrap" id="canvasWrap">
    <svg class="wires" id="wires"></svg>
    <div class="canvas" id="canvas"></div>
    <!-- 热区层：位于节点之上，只包含可点击的粗描边（透明），负责删线命中 -->
    <svg class="wirehits" id="wirehits"></svg>
    <div class="linkhint" id="linkHint">松开以连接到高亮的输入端口 · Esc 取消</div>
    <div class="drawer" id="drawer">
      <h4><span>事件流</span><span id="drawerClose" style="cursor:pointer">✕</span></h4>
      <div class="list" id="eventList">（暂无）</div>
    </div>
  </div>

  <aside class="side right">
    <div class="side-title">属性</div>
    <div class="props" id="props">
      <div class="empty">选中一个节点以编辑<br>或从左侧拖入节点</div>
    </div>
  </aside>
</div>

<div class="statusbar">
  <span class="msg" id="msg">就绪</span>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';

const state = {
  nodes: [], edges: [],
  nodeTypes: [],        // NodeTypeInfo[]
  typeMap: {},          // typeId -> NodeTypeInfo
  selected: null,
  linking: null,        // {from, fromPort, dataType, x, y}
  status: null,
  registry: null,       // 注册表候选（kinds/codecs/transforms/handlers/sinks）
  errIds: new Set(),
  seq: 1
};

const $ = id => document.getElementById(id);
const canvas = $('canvas'), wires = $('wires'), wirehits = $('wirehits'), wrap = $('canvasWrap');

const TYPE_COLORS = {
  protocol:'#8b6ce8', client:'#4c8dff', server:'#3ecf8e',
  codec:'#e8b64c', transform:'#e87bb0', handler:'#4cc9e8', sink:'#9aa4b6'
};
const TYPE_LETTERS = {
  protocol:'P', client:'C', server:'S', codec:'K', transform:'T', handler:'H', sink:'O'
};

function uid(p){ return p + '-' + (state.seq++) + '-' + Math.random().toString(36).slice(2,5); }
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(t, kind){
  const el = $('toast'); el.textContent = t; el.className = 'toast show ' + (kind||'ok');
  clearTimeout(el._h); el._h = setTimeout(()=>{ el.className='toast'; }, 2600);
}
function setMsg(t, kind){ const m = $('msg'); m.textContent = t; m.className='msg' + (kind?' '+kind:''); }

async function api(path, body){
  const opt = body === undefined ? {} : {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  };
  const res = await fetch(path, opt);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || '请求失败');
  return json.data;
}

function typeOf(nodeType){ return state.typeMap[nodeType] || null; }
function nodeById(id){ return state.nodes.find(n => n.id === id); }
/** 端口类型短标签，显示在端口上作为标识。 */
function shortType(t){
  if(t === 'RawFrame') return '帧';
  if(t === 'IMessage') return '消息';
  if(t === 'Any') return '任意';
  return t || '';
}

function colorOf(t){ return TYPE_COLORS[t] || '#8a95a6'; }
function letterOf(t){ return TYPE_LETTERS[t] || (t||'?').charAt(0).toUpperCase(); }

/* ---------------- 渲染 ---------------- */

function renderPalette(){
  $('palette').innerHTML = state.nodeTypes.map(t => `
    <div class="source" draggable="true" data-type="${esc(t.typeId)}">
      <div class="ic" style="background:${colorOf(t.typeId)}22;color:${colorOf(t.typeId)}">${letterOf(t.typeId)}</div>
      <div style="min-width:0"><div class="t">${esc(t.displayName)}</div>
        <div class="d">${esc(t.description)}</div></div>
    </div>`).join('');
  $('palette').querySelectorAll('.source').forEach(src => {
    src.addEventListener('dragstart', ev => {
      ev.dataTransfer.setData('text/plain', src.dataset.type);
      ev.dataTransfer.effectAllowed = 'copy';
    });
  });
}

function nodeSummary(n){
  const kv = [];
  const t = typeOf(n.nodeType);
  if(!t) return '';
  for(const f of t.fields){
    if(f.kind === 'Bool'){ if(n.settings[f.key] === 'true') kv.push([f.label, '开']); continue; }
    const v = n.settings[f.key];
    if(v) kv.push([f.label, v.length > 20 ? v.slice(0,20)+'…' : v]);
  }
  const st = state.status && state.status.nodes ? state.status.nodes.find(x => x.id === n.id) : null;
  let extra = '';
  if(st && st.state && st.state !== 'Static'){
    const cls = st.state === 'Ready' || st.state === 'Listening' ? 'ok' : (st.state === 'Absent' ? 'bad' : 'warn');
    extra = `<div class="kv" style="margin-top:3px"><span>状态</span><span style="color:var(--${cls==='ok'?'ok':cls==='bad'?'bad':'warn'})">${esc(st.state)}</span></div>`;
  }
  return kv.slice(0,3).map(([k,v]) => `<div class="kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('') + extra;
}

function renderNodes(){
  canvas.innerHTML = state.nodes.map(n => {
    const t = typeOf(n.nodeType);
    const sel = state.selected === n.id ? ' sel' : '';
    const err = state.errIds.has(n.id) ? ' err' : '';
    const ins = t ? t.ports.filter(p => p.direction === 'Input') : [];
    const outs = t ? t.ports.filter(p => p.direction === 'Output') : [];
    // 单列铺满：输入组在上、输出组在下。翻转只改锚点侧位（见 CSS），不改顺序。
    // 端口行：圆点、标签、类型徽标同处一条 flex 行，保证三者水平对齐。
    // 圆点用负 margin 骑在节点边框上（与 React Flow 的 handle 位置一致）。
    const inRows = ins.map(p => `
        <div class="port in" data-node="${n.id}" data-port="${esc(p.id)}" data-dir="in"
             data-type="${esc(p.dataType)}" title="输入端口（连线终点）· ${esc(p.label)} · ${esc(p.dataType)}${p.required?' · 必连':''}">
          <span class="pdot"></span><span class="plabel">${esc(p.label)}</span><span class="ptype">${esc(shortType(p.dataType))}</span></div>`).join('');
    const outRows = outs.map(p => `
        <div class="port out" data-node="${n.id}" data-port="${esc(p.id)}" data-dir="out"
             data-type="${esc(p.dataType)}" title="输出端口（从这里拖出连线）· ${esc(p.label)} · ${esc(p.dataType)}">
          <span class="plabel">${esc(p.label)}</span><span class="ptype">${esc(shortType(p.dataType))}</span><span class="pdot"></span></div>`).join('');
    const portHtml = `<div class="ports">${inRows}${outRows}</div>`;
    return `<div class="node${sel}${err}${n.flipped?' flipped':''}" data-id="${n.id}" data-type="${esc(n.nodeType)}"
                 style="left:${n.x}px;top:${n.y}px">
      <div class="node-head">
        <div class="ic" style="background:${colorOf(n.nodeType)}22;color:${colorOf(n.nodeType)}">${letterOf(n.nodeType)}</div>
        <div class="nm">${esc(n.label || (t?t.displayName:n.nodeType))}</div>
      </div>
      ${portHtml}
      <div class="node-body">${nodeSummary(n)}</div>
    </div>`;
  }).join('');
  markLinked();
  drawWires();
}

function markLinked(){
  const linked = new Set();
  state.edges.forEach(e => { linked.add(e.from+'|'+e.fromPort); linked.add(e.to+'|'+e.toPort); });
  canvas.querySelectorAll('.port').forEach(p => {
    if(linked.has(p.dataset.node+'|'+p.dataset.port)) p.classList.add('linked');
  });
}

/* ---------------- 连线 ---------------- */

/**
 * 计算端口中心点与其「法线方向」（端口朝外的方向）。
 * 锚点可能因翻转而位于节点左或右，曲线必须沿法线外推，
 * 否则两端同侧时控制点会把曲线拽进节点内部。
 */
function portAnchor(nodeId, portId){
  const el = canvas.querySelector(`.port[data-node="${nodeId}"][data-port="${portId}"] .pdot`);
  if(!el) return null;
  const r = el.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  const cx = r.left - wr.left + r.width/2;
  const cy = r.top - wr.top + r.height/2;

  // 朝向取圆点到「所在行内容」的方向：
  // 输入端口默认朝左、输出朝右；节点翻转后相反。
  const portEl = el.closest('.port');
  const nodeEl = el.closest('.node');
  const flipped = nodeEl.classList.contains('flipped');
  const isIn = portEl.dataset.dir === 'in';
  // 未翻转：in 朝左(-1)、out 朝右(+1)；翻转：相反
  const dir = (isIn ? -1 : 1) * (flipped ? -1 : 1);

  // 节点包围盒（与端口同一坐标系），供绕行路由避开整个节点而非仅避开端口
  const nr = nodeEl.getBoundingClientRect();
  const box = {
    l: nr.left - wr.left, r: nr.right - wr.left,
    t: nr.top - wr.top, b: nr.bottom - wr.top
  };
  return { x: cx, y: cy, dir, box };
}

/**
 * 生成两点间的三次贝塞尔路径。
 * 起点沿其法线出、终点沿其反法线入，控制点长度随水平距离自适应，
 * 保证曲线不会绕入节点矩形。
 */
/**
 * 生成端口间的连线路径。
 * - 正常情况（出口朝向目标）：三次贝塞尔，两端沿端口法线出入。
 * - 端口朝向与目标相反（如节点翻转后输出端口位于左边缘、目标却在右侧）：
 *   若仍直接出线必然横穿自身节点，故改为正交绕行——先沿法线出一小段，
 *   纵向让到节点带外，再水平走到目标侧，最后进入端口。
 */
function linkPath(a, b){
  const dx = b.x - a.x;
  const towards = Math.sign(dx) || 1;
  const stub = 18;

  const aFacesTarget = a.dir === towards;
  const bFacesTarget = b.dir === -towards;

  if(aFacesTarget && bFacesTarget){
    const k = Math.max(24, Math.min(Math.abs(dx) * 0.5, 180));
    const c1x = a.x + a.dir * k;
    const c2x = b.x + b.dir * k;
    return `M ${a.x} ${a.y} C ${c1x} ${a.y}, ${c2x} ${b.y}, ${b.x} ${b.y}`;
  }

  // 绕行曲线：先沿端口法线出一段，再以较大半径的贝塞尔绕到目标侧。
  // 相比直角折线更自然，且因为控制点落在节点带外，曲线不会穿入节点。
  const ax = a.x + a.dir * stub;
  const bx = b.x + b.dir * stub;
  const topBound = Math.min(a.box.t, b.box.t);
  const bottomBound = Math.max(a.box.b, b.box.b);
  const upY = topBound - 24;
  const downY = bottomBound + 24;
  const upCost = Math.abs(a.y - upY) + Math.abs(b.y - upY);
  const downCost = Math.abs(a.y - downY) + Math.abs(b.y - downY);
  const midY = upCost <= downCost ? upY : downY;

  const c1x = ax + a.dir * Math.max(18, Math.abs(bx - ax) * 0.25);
  const c2x = bx + b.dir * Math.max(18, Math.abs(bx - ax) * 0.25);
  return `M ${a.x} ${a.y} C ${ax} ${a.y}, ${c1x} ${midY}, ${(c1x + c2x) / 2} ${midY} ` +
         `C ${c2x} ${midY}, ${bx} ${b.y}, ${b.x} ${b.y}`;
}

function portCenter(nodeId, portId){
  const el = canvas.querySelector(`.port[data-node="${nodeId}"][data-port="${portId}"] .pdot`);
  if(!el) return null;
  const r = el.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  return { x: r.left - wr.left + r.width/2, y: r.top - wr.top + r.height/2 };
}

function drawWires(){
  let html = `<defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b6ce8"/><stop offset="100%" stop-color="#4c8dff"/>
    </linearGradient>
    <!-- 箭头标明数据流向：输出 → 输入 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ea6e8"/>
    </marker>
  </defs>`;
  for(const e of state.edges){
    const a = portAnchor(e.from, e.fromPort), b = portAnchor(e.to, e.toPort);
    if(!a || !b) continue;
    const d = linkPath(a, b);
    html += `<path d="${d}" stroke="url(#g)" stroke-width="2" fill="none" opacity=".9"
              marker-end="url(#arrow)" style="pointer-events:none"/>`;
    // 热区单独画到上层 svg（见 drawWires 末尾），此处不再输出到可见层
  }
  // ---- 热区层：只含透明粗描边，供点击删除 ----
  let hits = '';
  for(const e of state.edges){
    const a = portAnchor(e.from, e.fromPort), b = portAnchor(e.to, e.toPort);
    if(!a || !b) continue;
    const d = linkPath(a, b);
    hits += `<path d="${d}" stroke="transparent" stroke-width="12" fill="none"
               style="cursor:pointer" data-edge="${esc(e.id)}"/>`;
  }
  wirehits.innerHTML = hits;

  if(state.linking){
    const a = portCenter(state.linking.from, state.linking.fromPort);
    if(a){
      // 从起点拖出的虚线
      const b = { x: state.linking.x, y: state.linking.y };
      const dx = Math.max(46, Math.abs(b.x-a.x)*0.5);
      html += `<path d="M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}"
                stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4" fill="none"/>`;
    }
  }
  wires.innerHTML = html;
}

wrap.addEventListener('pointerdown', ev => {
  // 点到空白（非节点、非端口、非抽屉、非连线热区）：取消选择。
  // 必须排除连线热区：否则这里 renderNodes() 会销毁正在被点击的 path，
  // 导致后续 mousedown 目标错位、浏览器不再合成 click，表现为"删不掉连线"。
  if(ev.target.closest('.node') || ev.target.closest('.port') ||
     ev.target.closest('.drawer') || ev.target.closest('#wirehits')) return;
  if(state.linking){
    state.linking = null;
    clearHighlight();
    drawWires();
    return;
  }
  state.selected = null;
  renderNodes(); renderProps();
});

wrap.addEventListener('dragover', ev => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; });
wrap.addEventListener('drop', ev => {
  ev.preventDefault();
  const type = ev.dataTransfer.getData('text/plain');
  const t = state.typeMap[type];
  if(!t) return;
  const r = wrap.getBoundingClientRect();
  addNode(type, ev.clientX - r.left - 92, ev.clientY - r.top - 50);
});

function addNode(type, x, y){
  const t = state.typeMap[type];
  if(!t) return;
  const settings = {};
  for(const f of t.fields){
    if(f.defaultValue != null) settings[f.key] = f.defaultValue;
    // 注册表驱动的字段：默认取第一个候选，避免新节点必然校验失败
    if(f.optionsSource){
      const opts = resolveOptions(f);
      if(opts.length && !settings[f.key]) settings[f.key] = opts[0].value;
    }
  }
  // 放置位置避让：若与已有节点重叠，自动错开，避免新节点盖在旧节点上看不见
  const NODE_W = 230, NODE_H = 150, GAP = 16;
  let px = Math.max(8, Math.round(x));
  let py = Math.max(8, Math.round(y));
  for(let guard = 0; guard < 40; guard++){
    const clash = state.nodes.some(o =>
      Math.abs(o.x - px) < NODE_W + GAP && Math.abs(o.y - py) < NODE_H + GAP);
    if(!clash) break;
    px += NODE_W + GAP;
    if(px > 900){ px = 40; py += NODE_H + GAP; }
  }

  const n = {
    id: uid(type), nodeType: type,
    label: t.displayName, x: px, y: py,
    settings
  };
  state.nodes.push(n);
  state.selected = n.id;
  renderNodes(); renderProps();
  setMsg('已添加 ' + t.displayName);
}

/** 复制一个节点（含其设置），偏移 28px 放置，不复制连线。 */
function duplicateNode(id){
  const src = nodeById(id);
  if(!src) return;
  const t = typeOf(src.nodeType);
  const copy = {
    id: uid(src.nodeType),
    nodeType: src.nodeType,
    label: (src.label || t?.displayName || src.nodeType) + ' 副本',
    x: src.x + 28, y: src.y + 28,
    flipped: !!src.flipped,
    settings: JSON.parse(JSON.stringify(src.settings || {}))
  };
  state.nodes.push(copy);
  state.selected = copy.id;
  renderNodes(); renderProps();
  setMsg('已复制节点');
}

/* 拖动 / 选中 / 连线 */
let drag = null;

canvas.addEventListener('pointerdown', ev => {
  const portEl = ev.target.closest('.port');
  if(portEl){
    ev.preventDefault(); ev.stopPropagation();

    // 双向拖线：从输出端口拖向输入端口，或从输入端口反向拖向输出端口。
    // 业界编辑器（litegraph / React Flow）均支持反向拖，避免用户必须记住起拖方向。
    const wr = wrap.getBoundingClientRect();
    state.linking = {
      from: portEl.dataset.node, fromPort: portEl.dataset.port,
      fromDir: portEl.dataset.dir,
      dataType: portEl.dataset.type,
      x: ev.clientX - wr.left, y: ev.clientY - wr.top
    };
    highlightCompatible(state.linking.dataType, state.linking.fromDir);
    $('linkHint').classList.add('show');
    drawWires();
    return;
  }

  const nodeEl = ev.target.closest('.node');
  if(nodeEl){
    const id = nodeEl.dataset.id;
    state.selected = id;
    renderProps();
    canvas.querySelectorAll('.node').forEach(n => n.classList.toggle('sel', n.dataset.id === id));
    const n = nodeById(id);
    drag = { id, startX: ev.clientX, startY: ev.clientY, ox: n.x, oy: n.y };
    nodeEl.classList.add('dragging');
    nodeEl.setPointerCapture(ev.pointerId);
    return;
  }

  if(!ev.target.closest('.drawer')){
    state.selected = null;
    renderNodes(); renderProps();
  }
});

/**
 * 拖动时高亮候选端口。
 * @param {string} dataType 起拖端口的类型
 * @param {string} fromDir  起拖端口的方向：'out' 则候选是输入端口，'in' 则候选是输出端口
 */
function highlightCompatible(dataType, fromDir){
  const want = fromDir === 'out' ? 'in' : 'out';
  canvas.querySelectorAll('.port').forEach(p => {
    if(p.dataset.dir !== want){
      p.classList.remove('compat','incompat');
      return;
    }
    p.classList.remove('compat','incompat');
    const ok = p.dataset.type === dataType || dataType === 'Any' || p.dataset.type === 'Any';
    p.classList.add(ok ? 'compat' : 'incompat');
  });
}
function clearHighlight(){
  canvas.querySelectorAll('.port').forEach(p => p.classList.remove('compat','incompat'));
  $('linkHint').classList.remove('show');
}

// Esc 取消连线
window.addEventListener('keydown', e => {
  // 输入框内不拦截按键，避免误删
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;

  if(e.key === 'Escape'){
    if(state.linking){
      state.linking = null;
      clearHighlight();
      drawWires();
      setMsg('已取消连线');
      return;
    }
    if(state.selected){
      state.selected = null;
      renderNodes(); renderProps();
    }
    return;
  }

  // Delete / Backspace 删除选中节点（业界编辑器通行操作）
  if(e.key === 'Delete' || e.key === 'Backspace'){
    if(!state.selected) return;
    e.preventDefault();
    deleteNode(state.selected);
    return;
  }

  // Ctrl/Cmd+D 复制选中节点
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd'){
    if(!state.selected) return;
    e.preventDefault();
    duplicateNode(state.selected);
  }
});

canvas.addEventListener('pointermove', ev => {
  if(state.linking){
    const wr = wrap.getBoundingClientRect();
    state.linking.x = ev.clientX - wr.left;
    state.linking.y = ev.clientY - wr.top;
    drawWires();
    return;
  }
  if(!drag) return;
  const n = nodeById(drag.id);
  n.x = Math.max(0, drag.ox + (ev.clientX - drag.startX));
  n.y = Math.max(0, drag.oy + (ev.clientY - drag.startY));
  const el = canvas.querySelector(`.node[data-id="${drag.id}"]`);
  if(el){ el.style.left = n.x+'px'; el.style.top = n.y+'px'; }
  drawWires();
});

canvas.addEventListener('pointerup', async ev => {
  if(state.linking){
    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    // 落点方向与起拖方向相反：从 out 起拖找 in，从 in 起拖找 out（反向连线）
    const wantDir = state.linking.fromDir === 'out' ? 'in' : 'out';
    const portEl = target && target.closest
      ? target.closest(`.port[data-dir="${wantDir}"]`)
      : null;
    const link = state.linking;
    state.linking = null;
    clearHighlight();
    drawWires();

    if(portEl){
      await tryConnect(link, portEl.dataset.node, portEl.dataset.port);
    }
    return;
  }
  if(drag){
    const el = canvas.querySelector(`.node[data-id="${drag.id}"]`);
    if(el) el.classList.remove('dragging');
    drag = null;
  }
});

/** 连线前先问后端「这两个端口能不能连」，避免用户连出非法边。 */
async function tryConnect(link, toNode, toPort){
  // 反向拖线时，起拖端是输入、落点是输出，需要交换成「输出 → 输入」
  const reversed = link.fromDir === 'in';
  const srcNode = reversed ? toNode : link.from;
  const srcPort = reversed ? toPort : link.fromPort;
  const dstNode = reversed ? link.from : toNode;
  const dstPort = reversed ? link.fromPort : toPort;

  const from = nodeById(srcNode), to = nodeById(dstNode);
  if(!from || !to) return;
  if(from.id === to.id){ setMsg('不能连接到自己', 'bad'); return; }

  try{
    const r = await api('/api/connectable', {
      fromNodeType: from.nodeType, fromPort: srcPort,
      toNodeType: to.nodeType, toPort: dstPort
    });
    if(!r.ok){ setMsg('无法连接：' + (r.reason || '类型不匹配'), 'bad'); toast('端口类型不匹配', 'bad'); return; }
  }catch(e){
    // 后端不可用时退回前端本地判断
    const tp = typeOf(to.nodeType)?.ports.find(p => p.id === dstPort);
    if(tp && !(tp.dataType === link.dataType || tp.dataType === 'Any' || link.dataType === 'Any')){
      setMsg('无法连接：端口类型不匹配', 'bad'); return;
    }
  }

  // 一个输入端口只接一条线
  state.edges = state.edges.filter(e => !(e.to === dstNode && e.toPort === dstPort));
  state.edges.push({ id: uid('e'), from: srcNode, fromPort: srcPort, to: dstNode, toPort: dstPort });
  renderNodes();
  setMsg(`已连接 ${from.label} → ${to.label}`);
}

/** 删除连线：左键点击或右键都可以，且不再弹确认（连线可重连，误删成本低）。 */
function removeEdge(id){
  const before = state.edges.length;
  state.edges = state.edges.filter(e => e.id !== id);
  if(state.edges.length !== before){
    renderNodes();
    setMsg('已删除连线（可重新拖动端口连接）');
  }
}

wirehits.addEventListener('click', ev => {
  const id = ev.target.dataset && ev.target.dataset.edge;
  if(id) removeEdge(id);
});

wirehits.addEventListener('contextmenu', ev => {
  const id = ev.target.dataset && ev.target.dataset.edge;
  if(!id) return;
  ev.preventDefault();
  removeEdge(id);
});

// hover 连线时高亮，提示可点击删除
let hoverEdge = null;
wirehits.addEventListener('pointermove', ev => {
  const id = ev.target.dataset && ev.target.dataset.edge;
  if(id === hoverEdge) return;
  hoverEdge = id;
  wires.querySelectorAll('path[stroke^="url"]').forEach(p => p.setAttribute('opacity','.9'));
  if(id){
    const idx = [...wires.querySelectorAll('path[data-edge]')].findIndex(p => p.dataset.edge === id);
    const vis = wires.querySelectorAll('path[stroke^="url"]')[idx];
    if(vis){ vis.setAttribute('opacity','1'); vis.setAttribute('stroke-width','3'); }
    wires.style.cursor = 'pointer';
  } else {
    wires.querySelectorAll('path[stroke^="url"]').forEach(p => p.setAttribute('stroke-width','2'));
    wires.style.cursor = 'default';
  }
});

/* ---------------- 属性面板 ---------------- */

/** 解析字段候选：显式 Options 优先，否则取注册表对应清单。 */
function resolveOptions(f){
  if(f.options && f.options.length) return f.options;
  const map = {
    kinds: state.registry && state.registry.kinds,
    codecs: state.registry && state.registry.codecs,
    transforms: state.registry && state.registry.transforms,
    handlers: state.registry && state.registry.handlers,
    sinks: state.registry && state.registry.sinks
  };
  return (f.optionsSource && map[f.optionsSource]) || [];
}

function renderProps(){
  const box = $('props');
  const n = nodeById(state.selected);
  if(!n){ box.innerHTML = '<div class="empty">选中一个节点以编辑<br>或从左侧拖入节点</div>'; return; }

  const t = typeOf(n.nodeType);

  // 处理器：显示三个结果输出各自连到哪，便于确认路由
  let routeInfo = '';
  if(n.nodeType === 'handler'){
    const rows = (t?t.ports.filter(p=>p.direction==='Output'):[]).map(p => {
      const e = state.edges.find(x => x.from === n.id && x.fromPort === p.id);
      const target = e ? nodeById(e.to) : null;
      const label = target ? (target.label || target.nodeType) : '未连接';
      return `<div class="pv"><span>▶ ${esc(p.label)}</span><b>${esc(label)}</b></div>`;
    }).join('');
    routeInfo = `<div class="ports-view" style="margin-top:-4px">${rows}</div>`;
  }

  let html = `<div class="ports-view">
      ${(t?t.ports:[]).map(p => `<div class="pv"><span>${p.direction==='Input'?'◀':'▶'} ${esc(p.label)}</span>
        <b>${esc(p.dataType)}${p.required?' *':''}</b></div>`).join('')}
    </div>
    ${routeInfo}
    <div class="field"><label>显示名</label><input id="p-label" value="${esc(n.label)}"></div>`;

  for(const f of (t?t.fields:[])){
    // 值缺失时回落到字段声明的默认值，避免属性面板出现空输入框
    const v = (n.settings[f.key] !== undefined && n.settings[f.key] !== '')
      ? n.settings[f.key]
      : (f.defaultValue ?? '');
    if(f.kind === 'Bool'){
      html += `<div class="field"><label>${esc(f.label)}</label>
        <select id="p-${esc(f.key)}"><option value="false" ${v!=='true'?'selected':''}>关闭</option>
        <option value="true" ${v==='true'?'selected':''}>开启</option></select>
        ${f.help?`<div class="hint">${esc(f.help)}</div>`:''}</div>`;
    } else if(f.kind === 'Number' || f.kind === 'Text'){
      html += `<div class="field"><label>${esc(f.label)}</label>
        <input id="p-${esc(f.key)}" value="${esc(v)}"></div>`;
    } else if(f.kind === 'Lines'){
      html += `<div class="field"><label>${esc(f.label)}</label>
        <textarea id="p-${esc(f.key)}" rows="3">${esc(v)}</textarea>
        ${f.help?`<div class="hint">${esc(f.help)}</div>`:''}</div>`;
    } else if(f.kind === 'Select'){
      // 候选来自后端注册表时，渲染成「请选择 + 注册项」
      const opts = resolveOptions(f);
      html += `<div class="field"><label>${esc(f.label)}</label>
        <select id="p-${esc(f.key)}">
          <option value="" ${v===''?'selected':''}>— 请选择 —</option>
          ${opts.map(o => `<option value="${esc(o.value)}" ${v===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
        </select>${f.help?`<div class="hint">${esc(f.help)}</div>`:''}</div>`;
    }
  }

  // 处理器：模拟一次处理，按结果沿对应输出路由（验证闭环）
  if(n.nodeType === 'handler'){
    html += `<div class="tx-box">
        <div class="tx-title">模拟处理并路由</div>
        <div class="hint" style="margin-bottom:6px">输入一条消息，按「处理模式」产生结果并沿对应输出端口下发到下游设备。</div>
        <textarea id="p-procinput" rows="2" placeholder="输入消息"></textarea>
        <button class="ghost" id="p-procrun" style="width:100%;margin-top:6px">执行并路由</button>
        <div class="hint" id="p-procresult"></div>
      </div>`;
  }

  // 设备节点：调试直发（不经编排链路，直接写入该设备 socket）
  if(n.nodeType === 'client' || n.nodeType === 'server'){
    html += `<div class="tx-box">
        <div class="tx-title">调试直发</div>
        <div class="hint" style="margin-bottom:6px">直接用该节点自身的编解码器把文本发往 ${n.nodeType === 'client' ? '设备' : '全部入站会话'}，不经过编排链路。</div>
        <textarea id="p-txtext" rows="2" placeholder="要发送的文本"></textarea>
        <button class="ghost" id="p-txsend" style="width:100%;margin-top:6px">发送</button>
        <div class="hint" id="p-txresult"></div>
      </div>`;
  }

  html += `<div class="field-row" style="margin-bottom:11px">
      <button class="ghost" id="p-flip" style="width:100%">${n.flipped ? '恢复左入右出' : '左右翻转'}</button>
    </div>
    <div class="field"><button class="ghost danger" id="p-delete" style="width:100%">删除该节点</button></div>`;
  box.innerHTML = html;

  const bind = (key, fn, ev) => { const el = $('p-'+key); if(el) el.addEventListener(ev||'input', fn); };
  bind('label', ev => { n.label = ev.target.value; renderNodes(); });
  for(const f of (t?t.fields:[])){
    bind(f.key, ev => {
      n.settings[f.key] = ev.target.value;
      state.errIds.delete(n.id);
      renderNodes();
    }, (f.kind==='Select'||f.kind==='Bool') ? 'change' : 'input');
  }
  const procBtn = $('p-procrun');
  if(procBtn){
    procBtn.onclick = async () => {
      const text = $('p-procinput').value;
      const box = $('p-procresult');
      box.textContent = '执行中…';
      try{
        const rs = await api('/api/process', { nodeId: n.id, text });
        if(!rs.length){ box.textContent = '没有下游可路由'; return; }
        box.textContent = rs.map(r => `${r.nodeId}:${r.status}${r.ok ? ` ${r.bytesWritten}B` : ` (${r.error||''})`}`).join(' | ');
        toast(rs.every(r=>r.ok) ? '已路由' : '部分失败', rs.every(r=>r.ok) ? 'ok' : 'bad');
      }catch(e){ box.textContent = '异常：' + e.message; }
    };
  }

  const txBtn = $('p-txsend');
  if(txBtn){
    txBtn.onclick = async () => {
      const text = $('p-txtext').value;
      const box = $('p-txresult');
      box.textContent = '发送中…';
      try{
        const r = await api('/api/send', { nodeId: n.id, text });
        if(r.ok){
          box.textContent = `已发送 ${r.bytesWritten} 字节，会话 ${r.sessionCount}`;
          toast('已发送', 'ok');
        } else {
          box.textContent = `${r.status}：${r.error || ''}`;
          toast('发送失败：' + r.status, 'bad');
        }
      }catch(e){
        box.textContent = '异常：' + e.message;
      }
    };
  }

  const flip = $('p-flip');
  if(flip) flip.onclick = () => {
    n.flipped = !n.flipped;
    renderNodes(); renderProps();
    setMsg(n.flipped ? '已左右翻转：输入在右、输出在左' : '已恢复左入右出');
  };

  const del = $('p-delete');
  if(del) del.onclick = () => deleteNode(n.id);
}

function deleteNode(id){
  state.nodes = state.nodes.filter(n => n.id !== id);
  state.edges = state.edges.filter(e => e.from !== id && e.to !== id);
  if(state.selected === id) state.selected = null;
  renderNodes(); renderProps();
  setMsg('已删除节点');
}

/* ---------------- 与后端交互 ---------------- */

function buildGraph(){
  return {
    revision: state.status ? state.status.revision : 0,
    nodes: state.nodes.map(n => ({
      id: n.id, nodeType: n.nodeType, label: n.label, x: n.x, y: n.y,
      flipped: !!n.flipped, settings: n.settings
    })),
    edges: state.edges.map(e => ({
      id: e.id, from: e.from, fromPort: e.fromPort, to: e.to, toPort: e.toPort
    }))
  };
}

function applyIssues(issues){
  state.errIds = new Set((issues||[]).filter(i => i && i.nodeId).map(i => i.nodeId));
  renderNodes();
}

$('btnValidate').onclick = async () => {
  try{
    setMsg('校验中…');
    const r = await api('/api/validate', buildGraph());
    applyIssues(r.issues);
    if(r.ok){ setMsg('校验通过，可以应用', 'ok'); toast('校验通过', 'ok'); }
    else {
      setMsg('校验失败：' + r.issues.map(i=>i.message).join('；'), 'bad');
      toast('校验未通过', 'bad');
    }
  }catch(e){ setMsg('校验异常：' + e.message, 'bad'); }
};

$('btnApply').onclick = async () => {
  const btn = $('btnApply');
  btn.disabled = true; btn.textContent = '应用中…';
  try{
    const r = await api('/api/apply', buildGraph());
    applyIssues(r.issues);
    if(r.ok){
      setMsg(`已应用 rev=${r.revision}（新增 ${r.added} / 更新 ${r.updated} / 删除 ${r.removed} / 未变 ${r.unchanged}）`, 'ok');
      toast('已应用，无需重启服务', 'ok');
      await refresh();
    } else {
      setMsg('应用失败：' + r.issues.map(i=>i.message).join('；'), 'bad');
      toast('应用失败', 'bad');
    }
  }catch(e){ setMsg('应用异常：' + e.message, 'bad'); toast('应用异常', 'bad'); }
  finally{ btn.disabled = false; btn.textContent = '保存并应用'; }
};

$('btnEvents').onclick = () => $('drawer').classList.toggle('open');
$('drawerClose').onclick = () => $('drawer').classList.remove('open');
$('btnClear').onclick = () => {
  if(!confirm('清空画布？（不会立即影响运行中的服务，需再点应用）')) return;
  state.nodes = []; state.edges = []; state.selected = null;
  renderNodes(); renderProps(); setMsg('画布已清空');
};

async function refresh(){
  try{
    const s = await api('/api/state');
    state.status = s;
    $('liveDot').className = 'dot' + (s.running ? '' : ' off');
    $('sClient').textContent = s.clientCount;
    $('sServer').textContent = s.serverCount;
    $('sReady').textContent = s.readyClients;
    $('sSess').textContent = s.inboundSessions;
    $('sRev').textContent = s.revision;
    renderNodes();
    renderEventList(s.events || []);
  }catch(e){ /* 轮询失败不打断操作 */ }
}

function renderEventList(events){
  const box = $('eventList');
  if(!events.length){ box.textContent = '（暂无事件）'; return; }
  box.innerHTML = events.slice(-80).map(e => {
    const bad = ['Faulted','HandshakeFailed','HeartbeatTimeout','ProtocolFault'].includes(e.kind);
    return `<div><span class="${bad?'bad':'k'}">${esc(e.kind)}</span> ${esc(e.direction)} ${esc(e.target||'-')}`
      + (e.detail ? ` · ${esc(e.detail)}` : '') + `</div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

/* ---------------- 初始化 ---------------- */

async function loadNodeTypes(){
  state.nodeTypes = await api('/api/nodetypes');
  state.typeMap = {};
  state.nodeTypes.forEach(t => { state.typeMap[t.typeId] = t; });
  renderPalette();
}

function defaultSettings(typeId){
  const t = state.typeMap[typeId];
  const s = {};
  if(!t) return s;
  for(const f of t.fields){
    if(f.defaultValue != null) s[f.key] = f.defaultValue;
    if(f.optionsSource){
      const opts = resolveOptions(f);
      if(opts.length && !s[f.key]) s[f.key] = opts[0].value;
    }
  }
  return s;
}

async function loadInitial(){
  try{
    const g = await api('/api/graph');
    if(g && g.nodes && g.nodes.length){
      state.nodes = g.nodes;
      state.edges = g.edges || [];
      state.seq = state.nodes.length + 1;
      state.selected = null;
      renderNodes(); renderProps();
      setMsg('已载入已保存的编排图（rev ' + g.revision + '）');
      return;
    }
  }catch(e){ /* 首次为空 */ }

  // 示例：每个设备节点自带协议与编解码器，连线只表达数据流
  const hasClient = !!state.typeMap['client'];
  if(!hasClient) return;

  const mk = (type, label, x, y) => ({ id: uid(type), nodeType: type, label, x, y,
    settings: defaultSettings(type) });

  const c = mk('client', '客户端', 40, 40);
  const dec = mk('decoder', '解码器', 300, 40);
  const h = mk('handler', '处理器', 560, 40);
  const enc = mk('encoder', '编码器', 820, 40);
  const sNode = mk('server', '服务端', 40, 330);
  const dec2 = mk('decoder', '解码器2', 300, 330);
  const sink = mk('sink', '出口', 560, 330);

  state.nodes = [c, dec, h, enc, sNode, dec2, sink];
  state.edges = [
    // 上行：设备原始帧 → 解码器 → 处理器
    { id: uid('e'), from: c.id, fromPort:'out', to: dec.id, toPort:'in' },
    { id: uid('e'), from: dec.id, fromPort:'out', to: h.id, toPort:'in' },
    { id: uid('e'), from: sNode.id, fromPort:'out', to: dec2.id, toPort:'in' },
    { id: uid('e'), from: dec2.id, fromPort:'out', to: sink.id, toPort:'in' },
    // 下行：处理结果 → 编码器 → 设备 tx（与上行完全解耦）
    { id: uid('e'), from: h.id, fromPort:'ok', to: enc.id, toPort:'in' },
    { id: uid('e'), from: enc.id, fromPort:'out', to: c.id, toPort:'tx' }
  ];
  renderNodes(); renderProps();
  setMsg('已载入示例：上行经解码器、下行经编码器，两条链路互不耦合');
}

(async () => {
  await loadNodeTypes();
  try{ state.registry = await api('/api/registry'); }catch(e){ state.registry = null; }
  await loadInitial();
  await refresh();
  setInterval(refresh, 1800);
  window.addEventListener('resize', drawWires);
})();
</script>
</body>
</html>
